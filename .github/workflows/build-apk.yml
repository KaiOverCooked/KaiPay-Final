name: Build & Sign KaiPay Android APK (Play Store Ready)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Signed Android APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Verify Web Dist Artifacts
        run: |
          echo "Verifying Vite dist output..."
          if [ ! -f "dist/index.html" ]; then
            echo "ERROR: dist/index.html was not generated by Vite build!"
            exit 1
          fi
          echo "Contents of dist directory:"
          ls -lh dist/
          if [ -d "dist/assets" ]; then
            ls -lh dist/assets/
          fi

      - name: Copy Dist Web Assets to Android Assets
        run: |
          mkdir -p android/app/src/main/assets/dist
          rm -rf android/app/src/main/assets/dist/*
          cp -r dist/* android/app/src/main/assets/dist/
          echo "Verifying Android assets copy:"
          if [ ! -f "android/app/src/main/assets/dist/index.html" ]; then
            echo "ERROR: android/app/src/main/assets/dist/index.html is missing!"
            exit 1
          fi
          ls -lh android/app/src/main/assets/dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: |
          chmod +x gradlew
          if [ -f "android/gradlew" ]; then chmod +x android/gradlew; fi

      - name: Download Gradle Wrapper JAR if needed
        run: |
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Fetching official gradle-wrapper.jar..."
            curl -sLo gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Generate Production Release Keystore
        run: |
          mkdir -p android/app
          if [ ! -f "android/app/release.keystore" ]; then
            echo "Creating production signing keystore for Google Play Store..."
            keytool -genkeypair -v \
              -keystore android/app/release.keystore \
              -alias kaipay_key \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass kaipay_release_2026 \
              -keypass kaipay_release_2026 \
              -dname "CN=KaiPay Digital Banking, OU=Mobile Engineering, O=KaiPay Inc., L=Jakarta, ST=DKI Jakarta, C=ID"
          fi

      - name: Build Android Debug APK
        run: |
          cd android
          ../gradlew assembleDebug --stacktrace

      - name: Build Signed Android Release APK & AAB (Play Store)
        run: |
          cd android
          ../gradlew assembleRelease bundleRelease --stacktrace || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: KaiPay-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Upload Signed Release APK (Play Store Ready)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KaiPay-Signed-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 14

      - name: Upload Signed Android App Bundle (AAB for Play Console)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: KaiPay-Signed-App-Bundle-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 14
