name: Build KaiPay APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Node dependencies
        run: npm install --legacy-peer-deps

      - name: Build web application
        run: npm run build

      - name: Copy web assets into Android app
        run: |
          mkdir -p android/app/src/main/assets/dist
          cp -r dist/. android/app/src/main/assets/dist/

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare Gradle wrapper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p gradle/wrapper
          if [ ! -s gradle/wrapper/gradle-wrapper.jar ]; then
            curl --fail --silent --show-error --location \
              https://raw.githubusercontent.com/gradle/gradle/v8.2.1/gradle/wrapper/gradle-wrapper.jar \
              --output gradle/wrapper/gradle-wrapper.jar
          fi
          test -s gradle/wrapper/gradle-wrapper.jar

      - name: Generate missing launcher icon resources for CI
        shell: bash
        run: |
          set -euo pipefail
          ICON_DIR="android/app/src/main/res/mipmap-anydpi"
          mkdir -p "$ICON_DIR"
          cat > "$ICON_DIR/ic_launcher.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="48dp"
              android:height="48dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <path android:fillColor="#111827" android:pathData="M0,0h24v24h-24z"/>
              <path android:fillColor="#FFFFFF" android:pathData="M5,4h3v7l7,-7h4l-7,8 7,8h-4l-7,-7v7h-3z"/>
          </vector>
          EOF
          cp "$ICON_DIR/ic_launcher.xml" "$ICON_DIR/ic_launcher_round.xml"

      - name: Build debug APK
        run: ../gradlew assembleDebug --stacktrace
        working-directory: android

      - name: Verify APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KaiPay-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
