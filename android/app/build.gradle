apply plugin: 'com.android.application'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.kaipay.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.kaipay.app"
        minSdk 22
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'] ?: 'release.keystore')
                storePassword keystoreProperties['storePassword'] ?: 'kaipay_release_2026'
                keyAlias keystoreProperties['keyAlias'] ?: 'kaipay_key'
                keyPassword keystoreProperties['keyPassword'] ?: 'kaipay_release_2026'
            } else {
                // Default secure release signing for automated GitHub Actions and Play Store builds
                storeFile file('release.keystore')
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "kaipay_release_2026"
                keyAlias System.getenv("KEY_ALIAS") ?: "kaipay_key"
                keyPassword System.getenv("KEY_PASSWORD") ?: "kaipay_release_2026"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.10.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
